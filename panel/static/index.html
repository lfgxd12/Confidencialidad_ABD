<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Controles ISO 27001</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202b;--mut:#5b6877;--line:#e1e5ea;--acc:#1f4e8c;
--ok:#1b7f4b;--okbg:#e3f4ea;--pa:#9a6200;--pabg:#fff1d6;--no:#b3261e;--nobg:#fde7e5;--code:#0f1720;--codeink:#d7e0ea}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mut:#9aa7b6;--line:#2a3542;--acc:#6aa5f0;
--ok:#5fd09a;--okbg:#14301f;--pa:#f0b95a;--pabg:#3a2d0f;--no:#ff8f86;--nobg:#3d1a18;--code:#0b0f14;--codeink:#cbd6e2}}
:root[data-theme=dark]{--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mut:#9aa7b6;--line:#2a3542;--acc:#6aa5f0;--ok:#5fd09a;--okbg:#14301f;--pa:#f0b95a;--pabg:#3a2d0f;--no:#ff8f86;--nobg:#3d1a18;--code:#0b0f14;--codeink:#cbd6e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px 0;max-width:1180px;margin:auto}
h1{font-size:20px;margin:0}header p{margin:2px 0 12px;color:var(--mut);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:9px 12px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:1180px;margin:auto;padding:16px}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.Cumple,.Alto-ok{background:var(--okbg);color:var(--ok)}.Parcial,.Media,.Medio{background:var(--pabg);color:var(--pa)}
.No-cumple,.Alta,.Alto{background:var(--nobg);color:var(--no)}.Baja,.Bajo{background:var(--okbg);color:var(--ok)}
.Hallazgo{background:var(--nobg);color:var(--no)}
input,select,button.b{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
button.b{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.b:disabled{opacity:.5;cursor:not-allowed}
.bar{display:grid;grid-template-columns:54px 1fr 34px;gap:8px;align-items:center;margin:3px 0;font-size:13px}
.track{background:var(--line);height:12px;border-radius:6px;overflow:hidden}.fill{height:100%}
pre{background:var(--code);color:var(--codeink);padding:12px;border-radius:8px;overflow:auto;font:12.5px/1.45 ui-monospace,Consolas,monospace;max-height:70vh;white-space:pre}
.lk{color:var(--acc);cursor:pointer;text-decoration:underline;margin-right:8px;font-size:12.5px;white-space:nowrap}
.note{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.warn{border-left:4px solid var(--pa);background:var(--pabg);padding:8px 12px;border-radius:6px;font-size:13px;margin:8px 0}
.mod{background:var(--pabg);color:var(--pa)}.lec{background:var(--okbg);color:var(--ok)}.dng{border-color:var(--no)}
.sr{position:absolute;left:-9999px}
@media(max-width:600px){main{padding:10px}}
</style>
</head>
<body>
<header>
  <h1>Controles ISO/IEC 27001:2022 para la confidencialidad del DBA</h1>
  <p>Oracle Database 21c XE · EIF402 Administración de Bases de Datos · Luis Felipe Jiménez Fernández · Resultados de la ejecución del 22/10/2026</p>
  <nav role="tablist" id="nav"></nav>
</header>
<main id="main" aria-live="polite">Cargando…</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls=s=>String(s).replace(/ /g,"-");
const pill=s=>`<span class="pill ${cls(s)}">${esc(s)}</span>`;
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r};
const col=e=>e==="Cumple"?"var(--ok)":e==="Parcial"?"var(--pa)":"var(--no)";
const TABS=["Resumen","Matriz","Riesgos y tareas","Controles","Pruebas","Hallazgos","Evidencias","En vivo","Laboratorio"];
let tab=0,S={},evSel=null;

function nav(){$("#nav").innerHTML=TABS.map((t,i)=>`<button role="tab" aria-selected="${i===tab}" data-i="${i}">${t}</button>`).join("");
 $("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=+b.dataset.i;go()}}}
function tabla(cols,rows){return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function links(logs){return logs.map(l=>`<a class="lk" data-ev="${esc(l)}">${esc(l)}</a>`).join("")}

function donut(r){const t=r.total,seg=[["Cumple",r.Cumple],["Parcial",r.Parcial],["No cumple",r["No cumple"]]];let a=0,C=2*Math.PI*52,o="";
 for(const [n,v] of seg){const l=v/t*C;o+=`<circle r="52" cx="70" cy="70" fill="none" stroke="${col(n)}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=l}
 return `<svg viewBox="0 0 140 140" width="150" role="img" aria-label="Distribución de estados">${o}<text x="70" y="76" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${t}</text></svg>`}

async function resumen(){const r=S.res;
 const k=(n,l)=>`<div class="card kpi"><b>${n}</b><span>${l}</span></div>`;
 $("#main").innerHTML=`<div class="grid kpis">${k(r.matriz.total,"criterios evaluados")}${k(r.matriz.Cumple,"Cumple")}${k(r.matriz.Parcial,"Parcial")}${k(r.matriz["No cumple"],"No cumple")}${k(r.matriz.promedio+" / 4","madurez promedio")}${k(r.hallazgos.Alta,"hallazgos de prioridad alta")}</div>
 <div class="grid two" style="margin-top:12px">
  <div class="card"><h3 style="margin-top:0">Estados</h3><div class="row" style="gap:20px">${donut(r.matriz)}<div>${["Cumple","Parcial","No cumple"].map(e=>`<div>${pill(e)} ${r.matriz[e]}</div>`).join("<div style='height:6px'></div>")}</div></div>
   <p class="note">Escala 0-4 del informe: 4 Cumple, 2-3 Parcial, 0-1 No cumple.</p></div>
  <div class="card"><h3 style="margin-top:0">Peor criterio por control ISO</h3>${r.por_control.map(c=>`<div class="bar"><span>${c.control}</span><div class="track" title="${c.estado}"><div class="fill" style="width:${Math.max(c.peor,.15)/4*100}%;background:${col(c.estado)}"></div></div><b>${c.peor}</b></div>`).join("")}</div>
 </div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Riesgos R-CONF</h3>
  ${tabla(["Riesgo","Descripción","I×P","Nivel inherente","Peor control","Estado"],r.por_riesgo.map(x=>[x.id,esc(x.riesgo),x.valor,pill(x.nivel),x.peor??"—",x.estado?pill(x.estado):"—"]))}
  <p class="note">El estado del riesgo usa el peor control asociado (regla de presentación del panel, no de la matriz del informe). Impacto, probabilidad y nivel son la propuesta inicial del informe.</p></div>`}

function matriz(){const rows=S.mat;
 $("#main").innerHTML=`<div class="row"><input id="q" placeholder="Buscar tarea, control o texto" aria-label="Buscar"><select id="f" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option>Cumple</option><option>Parcial</option><option>No cumple</option></select><span class="note" id="cnt"></span></div><div class="card" id="t"></div>
 <p class="note">“Script 08” = el criterio lo calcula la consulta de <code>08_matriz_evaluacion.sql</code>. “Manual” = calificado a mano con la escala del informe.</p>`;
 const draw=()=>{const q=$("#q").value.toLowerCase(),f=$("#f").value;
  const v=rows.filter(r=>(!f||r.estado===f)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
  $("#cnt").textContent=v.length+" de "+rows.length;
  $("#t").innerHTML=tabla(["Tarea","Riesgo","Control","0-4","Estado","Origen","Evidencia y resultado","Logs"],v.map(r=>[r.tarea,`<span style="white-space:nowrap">${r.riesgo}</span>`,r.control,`<b>${r.criterio}</b>`,pill(r.estado),r.calculado?"Script 08":"Manual",`${esc(r.evidencia)}<br><span class="note">${esc(r.resultado)}</span>`,links(r.logs)]))};
 $("#q").oninput=draw;$("#f").onchange=draw;draw()}

async function riesgosTareas(){const [ri,ta]=await Promise.all([api("/api/riesgos").then(r=>r.json()),api("/api/tareas").then(r=>r.json())]);
 $("#main").innerHTML=`<div class="card"><h3 style="margin-top:0">Riesgos de confidencialidad</h3>${tabla(["ID","Riesgo","Amenaza y vulnerabilidad","I","P","I×P","Nivel"],ri.map(x=>[x.id,esc(x.riesgo),esc(x.amenaza),x.impacto,x.probabilidad,x.valor,pill(x.nivel)]))}</div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Tareas críticas del DBA</h3>${tabla(["ID","Tarea","Objetos o comandos Oracle","Riesgos","Controles Anexo A"],ta.map(x=>[x.id,esc(x.tarea),esc(x.objetos),x.riesgos.join(", "),x.controles.join(", ")]))}</div>`}

async function controles(){const [c,o]=await Promise.all([api("/api/controles").then(r=>r.json()),api("/api/observables").then(r=>r.json())]);
 $("#main").innerHTML=`<div class="card"><h3 style="margin-top:0">Controles del Anexo A (2022) con implementación en Oracle</h3>${tabla(["Control","Nombre","Implementación sugerida","Evidencia observable"],c.map(x=>[x.id,esc(x.nombre),esc(x.implementacion),`<code>${esc(x.evidencia)}</code>`]))}</div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">15 controles observables para un auditor externo</h3>${tabla(["ID","Qué se verifica","Consulta","Control","Script"],o.map(x=>[x.id,esc(x.que),`<code>${esc(x.consulta)}</code>`,x.control,x.script]))}</div>`}

async function pruebas(){const p=await api("/api/pruebas").then(r=>r.json());
 $("#main").innerHTML=`<div class="card"><h3 style="margin-top:0">Batería de pruebas técnicas</h3>${tabla(["ID","Tipo","Procedimiento","Esperado","Obtenido","Resultado","Logs"],p.map(x=>[x.id,x.tipo,esc(x.procedimiento),esc(x.esperado),esc(x.obtenido),pill(x.resultado),links(x.logs)]))}</div>`}

async function hallazgos(){const h=await api("/api/hallazgos").then(r=>r.json());
 $("#main").innerHTML=`<div class="card"><h3 style="margin-top:0">Hallazgos y acciones correctivas (fase Actuar)</h3>${tabla(["ID","Hallazgo","Riesgo","Control","Acción sugerida","Prioridad"],h.map(x=>[x.id,esc(x.hallazgo),x.riesgo,x.control,esc(x.accion),pill(x.prioridad)]))}
 <p class="note">Las acciones son sugerencias; este panel no modifica la base de datos.</p></div>`}

async function evidencias(){const l=await api("/api/evidencias/lista").then(r=>r.json());
 $("#main").innerHTML=`<div class="row"><select id="sel" aria-label="Archivo de evidencia">${l.map(e=>`<option ${e.nombre===evSel?"selected":""}>${esc(e.nombre)}</option>`).join("")}</select><span class="note">${l.length} archivos de la carpeta evidencias/</span></div><pre id="v">Elige un archivo</pre>`;
 const load=async()=>{const n=$("#sel").value;evSel=n;$("#v").textContent=await (await api("/api/evidencias/"+encodeURIComponent(n))).text()};
 $("#sel").onchange=load;if(l.length)load()}

function vivo(){const ok=S.svc.modo_vivo_disponible;
 $("#main").innerHTML=`<div class="card"><h3 style="margin-top:0">Verificación en vivo (solo lectura)</h3>
 <p>Ejecuta contra Oracle la consulta del script <code>08_matriz_evaluacion.sql</code> con la cuenta de auditoría del servidor y la compara con la evidencia del 22/10/2026.</p>
 ${ok?`<p class="note">Destino: <code>${esc(S.svc.dsn)}</code></p>`:`<div class="warn">Modo en vivo deshabilitado: falta <code>panel/.env</code> con ORACLE_USER y ORACLE_PASSWORD (ver README). Todo lo demás funciona con la evidencia.</div>`}
 <button class="b" id="go" ${ok?"":"disabled"}>Ejecutar verificación</button><div id="res" style="margin-top:12px"></div></div>`;
 $("#go").onclick=async()=>{const b=$("#go");b.disabled=true;$("#res").textContent="Consultando…";
  try{const r=await (await api("/api/en-vivo/ejecutar",{method:"POST"})).json();
   const cmp=r.comparacion;const lbl={igual:"Igual",mejoro:"Mejoró",empeoro:"Empeoró",manual:"Manual (no aplica)","sin dato":"Sin dato"};
   $("#res").innerHTML=`<p>Sesión: <b>${esc(r.usuario)}</b> en <b>${esc(r.contenedor)}</b> · ${esc(r.ejecutado)}</p>
   <p>${pill("Cumple")} ${r.resumen.Cumple} ${pill("Parcial")} ${r.resumen.Parcial} ${pill("No cumple")} ${r.resumen["No cumple"]}</p>
   <h4>Salida del script 08</h4>${tabla(["Control","Evidencia","0-4","Estado"],r.filas.map(f=>[f.ctl,esc(f.evidencia),f.criterio,pill(f.estado)]))}
   <h4>Comparación con la matriz del informe</h4>${tabla(["Tarea","Control","Informe","En vivo","Cambio"],cmp.map(c=>[c.tarea,c.control,c.evidencia,c.vivo??"—",lbl[c.cambio]]))}
   <p class="note">Diferencias esperadas: el script 07 eliminó el usuario auditor y las políticas de la demostración (T-09 baja de 4 a la línea base), y A8.20 mide la sesión del propio panel, no la de SQL Developer.</p>`}
  catch(e){$("#res").innerHTML=`<div class="warn">${esc(e.message)}</div>`}finally{b.disabled=false}}}


async function laboratorio(){const c=await api("/api/lab/catalogo").then(r=>r.json());
 const ok=c.habilitado;
 $("#main").innerHTML=`<div class="card"><h3 style="margin-top:0">Laboratorio: ejecutar los scripts desde la web</h3>
 <p>Corre los scripts del repositorio (lista blanca, sin SQL libre). Los que modifican usan <b>SYS</b> en <code>${esc(c.contenedor_esperado)}</code>; si la sesión cae en otro contenedor, no se ejecuta nada. Cada corrida se guarda en <code>evidencias/panel/</code> sin tocar los logs originales.</p>
 ${ok?"":`<div class="warn">Laboratorio apagado. En <code>panel/.env</code> pon <code>LAB_ENABLED=true</code> y <code>SYS_PASSWORD=…</code> y reinicia el panel. Puedes ver la vista previa de cada script sin conexión.</div>`}
 <div class="row"><button class="b" id="est" ${ok?"":"disabled"}>Ver qué existe ahora en la base</button><span id="estv" class="note"></span></div>
 ${tabla(["Orden","Script","Usuario","Tipo","Qué hace","Requiere","Acciones"],c.scripts.map((x,i)=>[i+1,`<b>${x.id}</b> ${esc(x.titulo)}<br><span class="note">${esc(x.archivo)}</span>`,x.como,`<span class="pill ${x.modifica?"mod":"lec"}">${x.modifica?"Modifica":"Lectura"}</span>`,esc(x.efecto)+(x.revierte?`<br><span class="note">Se revierte con: ${esc(x.revierte)}</span>`:""),x.requiere.join(", ")||"—",`<a class="lk" data-vp="${x.id}">Vista previa</a><a class="lk" data-ej="${x.id}">Ejecutar</a>`]))}
 </div><div id="panelrun" class="card" style="margin-top:12px;display:none"></div>`;
 $("#est").onclick=async()=>{try{const r=await (await api("/api/lab/estado")).json();$("#estv").textContent="Usuarios CONF*: "+(r.usuarios.join(", ")||"ninguno")+" · Políticas: "+(r.politicas.join(", ")||"ninguna")}catch(e){$("#estv").textContent=e.message}};
 const box=$("#panelrun");
 $("#main").onclick=async e=>{
  const vp=e.target.closest("[data-vp]"),ej=e.target.closest("[data-ej]");
  if(vp){const id=vp.dataset.vp,r=await (await api("/api/lab/vista-previa/"+id)).json();box.style.display="block";
   box.innerHTML=`<h4 style="margin-top:0">Vista previa del ${esc(id)} (se ejecutaría como ${esc(r.como)})</h4><pre>${esc(r.items.map(i=>i.tipo==="prompt"?"-- "+i.texto:i.texto+";").join("\n\n"))}</pre>`}
  if(ej){const id=ej.dataset.ej,x=c.scripts.find(y=>y.id===id);box.style.display="block";box.className="card"+(x.modifica?" dng":"");
   box.innerHTML=`<h4 style="margin-top:0">Ejecutar ${esc(id)} · ${esc(x.titulo)}</h4><p>${esc(x.efecto)} Usuario: <b>${esc(x.como)}</b>.</p>
   <div class="row"><input id="cf" placeholder="Escribe: EJECUTAR ${esc(id)}" size="22" autocomplete="off" aria-label="Confirmación"><button class="b" id="run" disabled>Ejecutar</button></div><pre id="out" style="display:none"></pre>`;
   const cf=$("#cf"),run=$("#run");cf.oninput=()=>{run.disabled=!ok||cf.value.trim()!=="EJECUTAR "+id};
   run.onclick=async()=>{run.disabled=true;const o=$("#out");o.style.display="block";o.textContent="Ejecutando…";
    try{const r=await (await api("/api/lab/ejecutar/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({confirmacion:cf.value.trim()})})).json();
     o.textContent=r.salida+"\n— Guardado en evidencias/"+r.log+" · errores: "+r.errores}
    catch(er){o.textContent="ERROR: "+er.message}finally{cf.value="";}}}}}

async function go(){nav();const m=$("#main");try{
 S.svc??=await api("/api/estado").then(r=>r.json());S.res??=await api("/api/resumen").then(r=>r.json());S.mat??=await api("/api/matriz").then(r=>r.json());
 $("#main").onclick=null;$("#main").className="";[resumen,matriz,riesgosTareas,controles,pruebas,hallazgos,evidencias,vivo,laboratorio][tab]()}catch(e){m.innerHTML=`<div class="warn">${esc(e.message)}</div>`}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-ev]");if(a){evSel=a.dataset.ev;tab=6;go()}});
go();
</script>
</body>
</html>
