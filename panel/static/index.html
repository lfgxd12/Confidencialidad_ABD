<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Controles ISO 27001</title>
<style>
:root{color-scheme:light;
--bg:#f3f5f8;--card:#fff;--ink:#14202c;--mut:#566474;--line:#dfe4ea;--acc:#1b4f8f;--accbg:#e6eef8;
--ok:#14703f;--okbg:#e1f3e8;--pa:#8a5600;--pabg:#fdefd0;--no:#a8231b;--nobg:#fbe3e0;--code:#0e151d;--codeink:#d3dde8;--r:10px}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f141a;--card:#171f29;--ink:#e7ecf2;--mut:#9aa8b8;--line:#293542;--acc:#7db1f5;--accbg:#1a2c44;
--ok:#63d39c;--okbg:#12301f;--pa:#f2bd62;--pabg:#392c0e;--no:#ff938a;--nobg:#3c1a18;--code:#0a0e13;--codeink:#c9d4e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:8px;top:-60px;background:var(--acc);color:#fff;padding:8px 12px;border-radius:8px;z-index:10}.skip:focus{top:8px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:1200px;margin:auto;padding:12px 16px 0}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
h1{font-size:19px;line-height:1.25;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 8px;color:var(--mut);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-shrink:0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mut)}.dot.on{background:var(--ok)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:10px 13px;font:inherit;cursor:pointer;white-space:nowrap;min-height:44px}
nav button:hover{color:var(--ink)}nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:1200px;margin:auto;padding:18px 16px 40px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:13px}
.kpi.k-Cumple{border-top:4px solid var(--ok)}.kpi.k-Parcial{border-top:4px solid var(--pa)}.kpi.k-No{border-top:4px solid var(--no)}
.lead{border-left:4px solid var(--no);background:var(--card)}.lead p{margin:0;max-width:75ch}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--card);position:sticky;top:0}
th[data-s]{cursor:pointer}th[data-s]:hover{color:var(--ink)}
tbody tr:hover td{background:color-mix(in srgb,var(--accbg) 55%,transparent)}
.pill{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.Cumple,.Baja,.Bajo,.lec{background:var(--okbg);color:var(--ok)}.Parcial,.Media,.Medio,.mod{background:var(--pabg);color:var(--pa)}
.No-cumple,.Alta,.Alto,.Hallazgo{background:var(--nobg);color:var(--no)}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}.pips i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.pips.Cumple i.f{background:var(--ok)}.pips.Parcial i.f{background:var(--pa)}.pips.No-cumple i.f{background:var(--no)}
.bar{display:grid;grid-template-columns:50px 1fr 22px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.track{background:var(--line);height:12px;border-radius:6px;overflow:hidden}.fill{height:100%;border-radius:6px}
.map{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 12px;align-items:center}
.map .rl{font-size:13px}.map .rl small{display:block;color:var(--mut)}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{border:0;border-radius:7px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.cell:hover{filter:brightness(.95);outline:2px solid currentColor}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:40px}
button.b{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--card);font-weight:600;cursor:pointer;min-height:40px}
button.b:disabled{opacity:.45;cursor:not-allowed}
pre{background:var(--code);color:var(--codeink);padding:14px;border-radius:8px;overflow:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace;max-height:68vh;white-space:pre}
code{background:var(--accbg);padding:1px 6px;border-radius:5px;font-size:.92em}
.lk{color:var(--acc);cursor:pointer;text-decoration:underline;margin-right:10px;font-size:13px;white-space:nowrap;background:none;border:0;padding:2px 0;font-family:inherit}
.note{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.warn{border-left:4px solid var(--pa);background:var(--pabg);padding:10px 14px;border-radius:6px;font-size:13.5px;margin:10px 0}
.dng{border-color:var(--no)}
.delta{font-weight:700}.delta.mejoro{color:var(--ok)}.delta.empeoro{color:var(--no)}
@media(max-width:640px){
 header{position:static}
 .top{flex-direction:column;gap:6px}h1{font-size:17px}.map{grid-template-columns:1fr}
 table.rs thead{display:none}table.rs,table.rs tbody,table.rs tr,table.rs td{display:block;width:100%}
 table.rs tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 4px}
 table.mx tr{display:grid;grid-template-columns:repeat(3,1fr)}table.mx td:nth-last-child(-n+2){grid-column:1/-1}
 table.rs td{border:0;padding:4px 10px}table.rs td::before{content:attr(data-l);display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
}
@media print{header,.tools,nav{position:static}body{background:#fff}.card{break-inside:avoid}}
@media(prefers-reduced-motion:no-preference){.fill{transition:width .4s}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header><div class="hd">
  <div class="top"><div><h1>Controles ISO/IEC 27001:2022 para la confidencialidad del DBA</h1>
  <p class="sub">Oracle Database 21c XE · EIF402 Administración de Bases de Datos · Luis Felipe Jiménez Fernández · Ejecución del 22/10/2026</p></div>
  <div class="tools"><span class="chip" id="conn" title="Estado de las conexiones"></span><button class="chip" id="theme" aria-label="Cambiar tema claro/oscuro">Tema</button></div></div>
  <nav role="tablist" aria-label="Secciones" id="nav"></nav></div></header>
<main id="main" tabindex="-1" aria-live="polite">Cargando…</main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls=s=>String(s).replace(/ /g,"-");
const ICON={"Cumple":"✓","Parcial":"◐","No cumple":"✕"};
const pill=s=>`<span class="pill ${cls(s)}">${ICON[s]?`<span aria-hidden="true">${ICON[s]}</span>`:""}${esc(s)}</span>`;
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r};
const col=e=>e==="Cumple"?"var(--ok)":e==="Parcial"?"var(--pa)":"var(--no)";
const est=n=>n===4?"Cumple":n>=2?"Parcial":"No cumple";
const pips=n=>`<span class="pips ${cls(est(n))}" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=n?"f":""}"></i>`).join("")}</span>`;
const TABS=["Resumen","Matriz","Riesgos y tareas","Controles","Pruebas","Hallazgos","Evidencias","En vivo","Laboratorio"];
let tab=0,S={},evSel=null,preq="",sortK=null,sortD=1;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function theme(){const t=store.get("tema");if(t)document.documentElement.dataset.theme=t;
 $("#theme").onclick=()=>{const d=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  const n=d?"light":"dark";document.documentElement.dataset.theme=n;store.set("tema",n)}}
if(!store.get("tema")&&matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.dataset.theme="dark";

function nav(){$("#nav").innerHTML=TABS.map((t,i)=>`<button role="tab" id="t${i}" aria-selected="${i===tab}" tabindex="${i===tab?0:-1}" data-i="${i}">${t}</button>`).join("");
 $("#nav").onclick=e=>{const b=e.target.closest("button");if(b){tab=+b.dataset.i;go()}};
 $("#nav").onkeydown=e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){tab=(tab+(e.key==="ArrowRight"?1:TABS.length-1))%TABS.length;go().then(()=>$("#t"+tab).focus())}}}
function tabla(cols,rows,extra=""){return `<div class="tw"><table class="rs ${extra}"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${esc(String(cols[i]).replace(/<[^>]+>/g,""))}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function links(logs){return logs.map(l=>`<button class="lk" data-ev="${esc(l)}">${esc(l)}</button>`).join("")}

function resumen(){const r=S.res,m=r.matriz;const k=(n,l,c="")=>`<div class="card kpi ${c}"><b>${n}</b><span>${l}</span></div>`;
 const malos=S.mat.filter(x=>x.estado==="No cumple").map(x=>x.control);
 $("#main").innerHTML=`<div class="card lead" style="margin-bottom:12px"><h2>Lectura rápida</h2><p>Los controles de acceso por privilegios cumplen (sin cuentas con ANY ni rol DBA). Los ${m["No cumple"]} criterios que no cumplen se concentran en cifrado en reposo y en red, el perfil de contraseñas, <code>PUBLIC</code> sobre paquetes <code>UTL_*</code> y parcheo. Madurez promedio ${m.promedio} de 4.</p></div>
 <div class="grid kpis">${k(m.total,"criterios evaluados")}${k(m.Cumple,"Cumple","k-Cumple")}${k(m.Parcial,"Parcial","k-Parcial")}${k(m["No cumple"],"No cumple","k-No")}${k(r.hallazgos.Alta,"hallazgos de prioridad alta")}</div>
 <div class="card" style="margin-top:12px"><h2>Mapa de riesgos y controles</h2><p class="note" style="margin-top:-4px">Cada celda es una fila de la matriz. Clic para verla en detalle.</p>
  <div class="map">${r.por_riesgo.map(x=>`<div class="rl"><b>${x.id}</b> ${pill(x.nivel)}<small>${esc(x.riesgo)}</small></div><div class="cells">${S.mat.filter(f=>f.riesgo===x.id).map(f=>`<button class="cell ${cls(f.estado)}" data-q="${f.tarea} ${f.control}" title="${esc(f.evidencia)}"><span aria-hidden="true">${ICON[f.estado]}</span>${f.tarea} · ${f.control}<span class="sr" style="position:absolute;left:-9999px"> ${f.estado}</span></button>`).join("")||'<span class="note">sin filas</span>'}</div>`).join("")}</div></div>
 <div class="grid two" style="margin-top:12px">
  <div class="card"><h3>Peor criterio por control ISO</h3>${r.por_control.map(c=>`<div class="bar"><span>${c.control}</span><div class="track" role="img" aria-label="${c.control}: ${c.peor} de 4, ${c.estado}"><div class="fill" style="width:${Math.max(c.peor,.15)/4*100}%;background:${col(c.estado)}"></div></div><b>${c.peor}</b></div>`).join("")}<p class="note">Escala 0-4 del informe: 4 Cumple, 2-3 Parcial, 0-1 No cumple.</p></div>
  <div class="card"><h3>Riesgos R-CONF</h3>${tabla(["Riesgo","I×P","Nivel","Peor control","Estado"],r.por_riesgo.map(x=>[`<b>${x.id}</b>`,x.valor,pill(x.nivel),x.peor??"—",x.estado?pill(x.estado):"—"]))}
  <p class="note">El estado del riesgo toma el peor control asociado (regla de presentación del panel, no de la matriz del informe).</p></div></div>`}

function matriz(){const rows=S.mat;
 $("#main").innerHTML=`<div class="row"><input id="q" placeholder="Buscar tarea, control o texto" aria-label="Buscar" size="26"><select id="f" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option>Cumple</option><option>Parcial</option><option>No cumple</option></select><span class="note" id="cnt" role="status"></span></div><div class="card" id="t" style="padding:6px"></div>
 <p class="note">“Script 08” = el criterio lo calcula la consulta de <code>08_matriz_evaluacion.sql</code>. “Manual” = calificado a mano con la escala del informe. Clic en un encabezado para ordenar.</p>`;
 $("#q").value=preq;
 const H=[["tarea","Tarea"],["riesgo","Riesgo"],["control","Control"],["criterio","0-4"],["estado","Estado"],["calculado","Origen"],[null,"Evidencia y resultado"],[null,"Logs"]];
 const draw=()=>{const q=$("#q").value.toLowerCase(),f=$("#f").value;
  let v=rows.filter(r=>(!f||r.estado===f)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
  if(sortK)v=[...v].sort((a,b)=>(a[sortK]>b[sortK]?1:a[sortK]<b[sortK]?-1:0)*sortD);
  $("#cnt").textContent=v.length+" de "+rows.length;
  $("#t").innerHTML=tabla(H.map(([k,l])=>k?`<span data-s="${k}">${l}${sortK===k?(sortD>0?" ▲":" ▼"):""}</span>`:l),v.map(r=>[r.tarea,`<span style="white-space:nowrap">${r.riesgo}</span>`,r.control,`${pips(r.criterio)}<b>${r.criterio}</b>`,pill(r.estado),r.calculado?"Script 08":"Manual",`${esc(r.evidencia)}<br><span class="note">${esc(r.resultado)}</span>`,links(r.logs)]),"mx")};
 $("#q").oninput=e=>{preq=e.target.value;draw()};$("#f").onchange=draw;draw();
 $("#t").onclick=e=>{const s=e.target.closest("[data-s]");if(s){const k=s.dataset.s;sortD=sortK===k?-sortD:1;sortK=k;draw()}}}

async function riesgosTareas(){const [ri,ta]=await Promise.all([api("/api/riesgos").then(r=>r.json()),api("/api/tareas").then(r=>r.json())]);
 $("#main").innerHTML=`<div class="card"><h2>Riesgos de confidencialidad</h2>${tabla(["ID","Riesgo","Amenaza y vulnerabilidad","I","P","I×P","Nivel"],ri.map(x=>[x.id,esc(x.riesgo),esc(x.amenaza),x.impacto,x.probabilidad,x.valor,pill(x.nivel)]))}</div>
 <div class="card" style="margin-top:12px"><h2>Tareas críticas del DBA</h2>${tabla(["ID","Tarea","Objetos o comandos Oracle","Riesgos","Controles Anexo A"],ta.map(x=>[x.id,esc(x.tarea),esc(x.objetos),x.riesgos.join(", "),x.controles.join(", ")]))}</div>`}
async function controles(){const [c,o]=await Promise.all([api("/api/controles").then(r=>r.json()),api("/api/observables").then(r=>r.json())]);
 $("#main").innerHTML=`<div class="card"><h2>Controles del Anexo A (2022) con implementación en Oracle</h2>${tabla(["Control","Nombre","Implementación sugerida","Evidencia observable"],c.map(x=>[`<b>${x.id}</b>`,esc(x.nombre),esc(x.implementacion),`<code>${esc(x.evidencia)}</code>`]))}</div>
 <div class="card" style="margin-top:12px"><h2>15 controles observables para un auditor externo</h2>${tabla(["ID","Qué se verifica","Consulta","Control","Script"],o.map(x=>[x.id,esc(x.que),`<code>${esc(x.consulta)}</code>`,x.control,x.script]))}</div>`}
async function pruebas(){const p=await api("/api/pruebas").then(r=>r.json());
 $("#main").innerHTML=`<div class="card"><h2>Batería de pruebas técnicas</h2>${tabla(["ID","Tipo","Procedimiento","Esperado","Obtenido","Resultado","Logs"],p.map(x=>[`<b>${x.id}</b>`,x.tipo,esc(x.procedimiento),esc(x.esperado),esc(x.obtenido),pill(x.resultado),links(x.logs)]))}</div>`}
async function hallazgos(){const h=await api("/api/hallazgos").then(r=>r.json());
 $("#main").innerHTML=`<div class="card"><h2>Hallazgos y acciones correctivas (fase Actuar)</h2>${tabla(["ID","Hallazgo","Riesgo","Control","Acción sugerida","Prioridad"],h.map(x=>[`<b>${x.id}</b>`,esc(x.hallazgo),x.riesgo,x.control,esc(x.accion),pill(x.prioridad)]))}<p class="note">Las acciones son sugerencias; el panel no las aplica.</p></div>`}
async function evidencias(){const l=await api("/api/evidencias/lista").then(r=>r.json());
 $("#main").innerHTML=`<div class="row"><select id="sel" aria-label="Archivo de evidencia">${l.map(e=>`<option ${e.nombre===evSel?"selected":""}>${esc(e.nombre)}</option>`).join("")}</select><span class="note">${l.length} archivos en evidencias/</span></div><pre id="v" tabindex="0" aria-label="Contenido del archivo">Elige un archivo</pre>`;
 const load=async()=>{const n=$("#sel").value;evSel=n;$("#v").textContent=await (await api("/api/evidencias/"+encodeURIComponent(n))).text()};
 $("#sel").onchange=load;if(l.length)load()}

function vivo(){const ok=S.svc.modo_vivo_disponible;
 $("#main").innerHTML=`<div class="card"><h2>Verificación en vivo (solo lectura)</h2>
 <p>Ejecuta contra Oracle la consulta de <code>08_matriz_evaluacion.sql</code> con la cuenta de auditoría del servidor y la compara con la evidencia del 22/10/2026.</p>
 ${ok?`<p class="note">Destino: <code>${esc(S.svc.dsn)}</code></p>`:`<div class="warn">Modo en vivo deshabilitado: falta <code>panel/.env</code> con ORACLE_USER y ORACLE_PASSWORD (ver README). Lo demás funciona con la evidencia.</div>`}
 <button class="b" id="go" ${ok?"":"disabled"}>Ejecutar verificación</button><div id="res" style="margin-top:14px" role="status"></div></div>`;
 $("#go").onclick=async()=>{const b=$("#go");b.disabled=true;$("#res").textContent="Consultando…";
  try{const r=await (await api("/api/en-vivo/ejecutar",{method:"POST"})).json();
   const cmp=r.comparacion;const lbl={igual:"Igual",mejoro:"▲ Mejoró",empeoro:"▼ Empeoró",manual:"Manual","sin dato":"Sin dato"};
   const dif=cmp.filter(c=>c.cambio==="mejoro"||c.cambio==="empeoro").length;
   $("#res").innerHTML=`<p>Sesión <b>${esc(r.usuario)}</b> en <b>${esc(r.contenedor)}</b> · ${esc(r.ejecutado)}</p>
   <p>${pill("Cumple")} ${r.resumen.Cumple} &nbsp;${pill("Parcial")} ${r.resumen.Parcial} &nbsp;${pill("No cumple")} ${r.resumen["No cumple"]} &nbsp;· <b>${dif}</b> diferencia(s) contra el informe</p>
   <h3>Comparación con la matriz del informe</h3>${tabla(["Tarea","Control","Informe","En vivo","Cambio"],cmp.map(c=>[c.tarea,c.control,`${pips(c.evidencia)}${c.evidencia}`,c.vivo==null?"—":`${pips(c.vivo)}${c.vivo}`,`<span class="delta ${c.cambio}">${lbl[c.cambio]}</span>`]))}
   <h3 style="margin-top:16px">Salida del script 08</h3>${tabla(["Control","Evidencia","0-4","Estado"],r.filas.map(f=>[f.ctl,esc(f.evidencia),`${pips(f.criterio)}${f.criterio}`,pill(f.estado)]))}
   <p class="note">Diferencias esperadas: el script 07 elimina las políticas de la demostración (T-09 vuelve a la línea base), y A8.20 mide la sesión del propio panel.</p>`}
  catch(e){$("#res").innerHTML=`<div class="warn">${esc(e.message)}</div>`}finally{b.disabled=false}}}

async function laboratorio(){const c=await api("/api/lab/catalogo").then(r=>r.json());const ok=c.habilitado;
 $("#main").innerHTML=`<div class="card"><h2>Laboratorio: ejecutar los scripts desde la web</h2>
 <p>Corre los scripts del repositorio (lista blanca, sin SQL libre). Los que modifican usan <b>SYS</b> en <code>${esc(c.contenedor_esperado)}</code>; si la sesión cae en otro contenedor no se ejecuta nada. Cada corrida se guarda en <code>evidencias/panel/</code> sin tocar los logs originales.</p>
 ${ok?"":`<div class="warn">Laboratorio apagado. En <code>panel/.env</code> pon <code>LAB_ENABLED=true</code> y <code>SYS_PASSWORD=…</code> y reinicia. La vista previa funciona sin conexión.</div>`}
 <div class="row"><button class="b" id="est" ${ok?"":"disabled"}>Ver qué existe ahora en la base</button><span id="estv" class="note" role="status"></span></div>
 ${tabla(["#","Script","Usuario","Tipo","Qué hace","Requiere","Acciones"],c.scripts.map((x,i)=>[i+1,`<b>${x.id}</b> ${esc(x.titulo)}<br><span class="note">${esc(x.archivo)}</span>`,x.como,`<span class="pill ${x.modifica?"mod":"lec"}">${x.modifica?"Modifica":"Lectura"}</span>`,esc(x.efecto)+(x.revierte?`<br><span class="note">Se revierte con: ${esc(x.revierte)}</span>`:""),x.requiere.join(", ")||"—",`<button class="lk" data-vp="${x.id}">Vista previa</button><button class="lk" data-ej="${x.id}">Ejecutar</button>`]))}
 </div><div id="panelrun" class="card" style="margin-top:12px;display:none" role="region" aria-label="Ejecución"></div>`;
 $("#est").onclick=async()=>{try{const r=await (await api("/api/lab/estado")).json();$("#estv").textContent="Usuarios CONF*: "+(r.usuarios.join(", ")||"ninguno")+" · Políticas: "+(r.politicas.join(", ")||"ninguna")}catch(e){$("#estv").textContent=e.message}};
 const box=$("#panelrun");
 $("#main").onclick=async e=>{const vp=e.target.closest("[data-vp]"),ej=e.target.closest("[data-ej]");
  if(vp){const id=vp.dataset.vp,r=await (await api("/api/lab/vista-previa/"+id)).json();box.style.display="block";box.className="card";
   box.innerHTML=`<h3>Vista previa del ${esc(id)} (se ejecutaría como ${esc(r.como)})</h3><pre tabindex="0">${esc(r.items.map(i=>i.tipo==="prompt"?"-- "+i.texto:i.texto+";").join("\n\n"))}</pre>`;box.scrollIntoView({behavior:"smooth",block:"nearest"})}
  if(ej){const id=ej.dataset.ej,x=c.scripts.find(y=>y.id===id);box.style.display="block";box.className="card"+(x.modifica?" dng":"");
   box.innerHTML=`<h3>Ejecutar ${esc(id)} · ${esc(x.titulo)}</h3><p>${esc(x.efecto)} Usuario: <b>${esc(x.como)}</b>.</p>
   <div class="row"><input id="cf" placeholder="Escribe: EJECUTAR ${esc(id)}" size="24" autocomplete="off" aria-label="Confirmación"><button class="b" id="run" disabled>Ejecutar</button></div><pre id="out" style="display:none" tabindex="0"></pre>`;
   const cf=$("#cf"),run=$("#run");cf.oninput=()=>{run.disabled=!ok||cf.value.trim()!=="EJECUTAR "+id};cf.focus();box.scrollIntoView({behavior:"smooth",block:"nearest"});
   run.onclick=async()=>{run.disabled=true;const o=$("#out");o.style.display="block";o.textContent="Ejecutando…";
    try{const r=await (await api("/api/lab/ejecutar/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({confirmacion:cf.value.trim()})})).json();
     o.textContent=r.salida+"\n— Guardado en evidencias/"+r.log+" · errores: "+r.errores}
    catch(er){o.textContent="ERROR: "+er.message}finally{cf.value=""}}}}}

async function go(){nav();const m=$("#main");try{
 S.svc??=await api("/api/estado").then(r=>r.json());S.res??=await api("/api/resumen").then(r=>r.json());S.mat??=await api("/api/matriz").then(r=>r.json());
 $("#conn").innerHTML=`<span class="dot ${S.svc.modo_vivo_disponible?"on":""}"></span>${S.svc.modo_vivo_disponible?"Oracle configurado":"Modo evidencia"}`;
 m.onclick=null;await [resumen,matriz,riesgosTareas,controles,pruebas,hallazgos,evidencias,vivo,laboratorio][tab]()}catch(e){m.innerHTML=`<div class="warn">${esc(e.message)}</div>`}}
document.addEventListener("click",e=>{const a=e.target.closest("[data-ev]");if(a){evSel=a.dataset.ev;tab=6;go();return}
 const c=e.target.closest("[data-q]");if(c){preq=c.dataset.q;tab=1;go()}});
theme();go();
</script>
</body>
</html>
